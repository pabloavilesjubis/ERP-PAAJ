  .nav-item { display: flex; align-items: center; gap: var(--s-3); padding: 10px var(--s-3); border-radius: var(--r-md); cursor: pointer; font-size: var(--text-sm); font-weight: 500; color: var(--fg-2); transition: background var(--d-fast) var(--ease-out), color var(--d-fast); user-select: none; }

  .topbar-title { font-size: var(--text-lg); font-weight: 600; color: var(--fg-1); flex: 1; }
  .month-selector { display: flex; align-items: center; gap: var(--s-2); }
  .month-select { border: 1px solid var(--border); border-radius: var(--r-md); padding: 6px var(--s-3); font-size: var(--text-sm); font-family: var(--font-sans); color: var(--fg-1); background: var(--surface-1); cursor: pointer; outline: none; }

  /* KPI Cards */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--s-5); margin-bottom: var(--s-7); }
  .kpi-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--s-5) var(--s-6); }
  .kpi-label { font-size: var(--text-xs); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-3); margin-bottom: var(--s-2); }
  .kpi-value { font-size: var(--text-3xl); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: var(--tracking-tight); color: var(--fg-1); }
  .kpi-value.primary { color: var(--brand-primary-700); }
  .kpi-value.danger { color: var(--danger); }
  .kpi-value.warning { color: var(--brand-accent-600); }
  .kpi-sub { font-size: var(--text-xs); color: var(--fg-3); margin-top: var(--s-1); font-variant-numeric: tabular-nums; }

  .tax-row-label { font-size: var(--text-sm); color: var(--fg-2); }

  .section-desc { font-size: var(--text-sm); color: var(--fg-3); margin-top: 2px; }

  .btn { display: inline-flex; align-items: center; gap: var(--s-2); padding: 8px var(--s-4); border-radius: var(--r-md); font-size: var(--text-sm); font-weight: 500; cursor: pointer; border: none; transition: background var(--d-fast), transform var(--d-fast); font-family: var(--font-sans); }

  .btn-primary { background: var(--brand-primary-700); color: white; }

  .contrib-field { font-size: var(--text-xs); color: var(--fg-3); display: flex; gap: var(--s-2); }

  .chart-title { font-size: var(--text-md); font-weight: 600; margin-bottom: var(--s-5); }
  .bar-chart { display: flex; align-items: flex-end; gap: var(--s-3); height: 140px; }

function Modal({ title, onClose, onSave, children }) {
  return (
    <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-header">
          <span className="modal-title">{title}</span>
          <button className="btn-icon" onClick={onClose}><Icon name="x" size={16} /></button>
        </div>
        <div className="modal-body">{children}</div>
        <div className="modal-footer">
          <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={onSave}><Icon name="check" size={15}/>Guardar</button>
        </div>
      </div>
    </div>
  );
}

/* ─────────── HUB ─────────── */
function HubScreen({ data, month, year }) {
  const { ventasConsumidor, ventasContribuyente, compras } = data;

  const filterByMonth = (arr, dateKey = 'fecha') =>
    arr.filter(r => {
      const d = new Date(r[dateKey]);
      return d.getMonth() === month && d.getFullYear() === year;
    });

  const vc = filterByMonth(ventasConsumidor);
  const vt = filterByMonth(ventasContribuyente);
  const cp = filterByMonth(compras);

  const totalVentasC = vc.reduce((s, r) => s + num(r.monto), 0);
  const totalVentasT = vt.reduce((s, r) => s + num(r.gravado) + num(r.exento), 0);
  const totalVentasGravT = vt.reduce((s, r) => s + num(r.gravado), 0);
  const totalVentas = totalVentasC + totalVentasT;

  const ivaDebito = (totalVentasC + totalVentasGravT) * IVA_RATE;
  const ivaCredito = cp.reduce((s, r) => s + num(r.ivaCredito), 0);
  const ivaNeto = ivaDebito - ivaCredito;
  const totalCompras = cp.reduce((s, r) => s + num(r.monto), 0);
  const pagoACuenta = totalVentas * PAGO_CUENTA_RATE;

  // Bar chart — last 6 months
  const monthsData = Array.from({ length: 6 }, (_, i) => {
    const mi = (month - 5 + i + 12) % 12;
    const yi = month - 5 + i < 0 ? year - 1 : year;
    const label = MONTHS[mi].slice(0, 3);
    const vc_ = ventasConsumidor.filter(r => { const d = new Date(r.fecha); return d.getMonth() === mi && d.getFullYear() === yi; }).reduce((s, r) => s + num(r.monto), 0);
    const vt_ = ventasContribuyente.filter(r => { const d = new Date(r.fecha); return d.getMonth() === mi && d.getFullYear() === yi; }).reduce((s, r) => s + num(r.gravado) + num(r.exento), 0);
    const cp_ = compras.filter(r => { const d = new Date(r.fecha); return d.getMonth() === mi && d.getFullYear() === yi; }).reduce((s, r) => s + num(r.monto), 0);
    return { label, vc: vc_, vt: vt_, cp: cp_, total: vc_ + vt_ };
  });
  const maxVal = Math.max(...monthsData.map(d => Math.max(d.total, d.cp)), 1);

  return (
    <div>
      <div className="kpi-grid">
        <div className="kpi-card">
          <div className="kpi-label">Ventas totales</div>
          <div className="kpi-value primary">{fmt(totalVentas)}</div>
          <div className="kpi-sub">Consumidor {fmt(totalVentasC)} + Contribuyente {fmt(totalVentasT)}</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">Total compras</div>
          <div className="kpi-value">{fmt(totalCompras)}</div>
          <div className="kpi-sub">{cp.length} registros este mes</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">IVA débito (ventas)</div>
          <div className="kpi-value danger">{fmt(ivaDebito)}</div>
          <div className="kpi-sub">13% sobre ventas gravadas</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">IVA crédito (compras)</div>
          <div className="kpi-value" style={{color:'var(--success-text)'}}>{fmt(ivaCredito)}</div>
          <div className="kpi-sub">Acreditable este mes</div>
        </div>
        <div className="kpi-card" style={{border:'1px solid var(--brand-primary-200)', background:'var(--brand-primary-50)'}}>
          <div className="kpi-label" style={{color:'var(--brand-primary-700)'}}>IVA a pagar</div>
          <div className="kpi-value" style={{color: ivaNeto > 0 ? 'var(--danger)' : 'var(--success-text)'}}>{fmt(Math.max(ivaNeto, 0))}</div>
          <div className="kpi-sub">Débito − Crédito</div>
        </div>
      </div>

      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'var(--s-5)', marginBottom:'var(--s-5)'}}>
        {/* Tax breakdown */}
        <div className="tax-card">
          <div className="tax-card-title">Desglose de impuestos — {MONTHS[month]} {year}</div>
          <div className="tax-row">
            <div>
              <div className="tax-row-label">Ventas al consumidor (gravadas)</div>
              <div className="tax-row-sub">Factura Electrónica · {vc.length} registros</div>
            </div>
            <div className="tax-row-value">{fmt(totalVentasC)}</div>
          </div>
          <div className="tax-row">
            <div>
              <div className="tax-row-label">Ventas al contribuyente (gravadas)</div>
              <div className="tax-row-sub">CCF · {vt.length} registros</div>
            </div>
            <div className="tax-row-value">{fmt(totalVentasGravT)}</div>
          </div>
          <div className="tax-row">
            <div>
              <div className="tax-row-label">IVA débito (13%)</div>
              <div className="tax-row-sub">Ventas gravadas × 0.13</div>
            </div>
            <div className="tax-row-value debit">{fmt(ivaDebito)}</div>
          </div>
          <div className="tax-row">
            <div>
              <div className="tax-row-label">IVA crédito fiscal</div>
              <div className="tax-row-sub">De compras registradas</div>
            </div>
            <div className="tax-row-value credit">− {fmt(ivaCredito)}</div>
          </div>
          <div className="tax-row">
            <div>
              <div className="tax-row-label">Pago a cuenta (1.75%)</div>
              <div className="tax-row-sub">Anticipo impuesto sobre renta</div>
            </div>
            <div className="tax-row-value debit">{fmt(pagoACuenta)}</div>
          </div>
          <div className="tax-total-row">
            <div>
              <div className="tax-total-label">Total a declarar (IVA + Pago a cuenta)</div>
            </div>
            <div className="tax-total-value">{fmt(Math.max(ivaNeto, 0) + pagoACuenta)}</div>
          </div>
        </div>

        {/* Chart */}
        <div className="chart-wrap">
          <div className="chart-title">Ventas vs. Compras — últimos 6 meses</div>
          <div className="bar-chart">
            {monthsData.map((d, i) => (
              <div className="bar-group" key={i}>
                <div className="bars">
                  <div className="bar" title={`Ventas: ${fmt(d.total)}`} style={{height: `${(d.total/maxVal)*110}px`, background:'var(--brand-primary-500)'}} />
                  <div className="bar" title={`Compras: ${fmt(d.cp)}`} style={{height: `${(d.cp/maxVal)*110}px`, background:'var(--brand-accent-500)'}} />
                </div>
                <div className="bar-label">{d.label}</div>
              </div>
            ))}
          </div>
          <div className="chart-legend">
            <div className="legend-item"><div className="legend-dot" style={{background:'var(--brand-primary-500)'}}></div>Ventas</div>
            <div className="legend-item"><div className="legend-dot" style={{background:'var(--brand-accent-500)'}}></div>Compras</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function VentasConsumidorScreen({ data, setData, month, year }) {
  const [showModal, setShowModal] = useState(false);
  const [editRow, setEditRow] = useState(null);
  const [form, setForm] = useState({ fecha: '', descripcion: '', monto: '', notas: '' });

  const rows = data.ventasConsumidor.filter(r => {
    const d = new Date(r.fecha);
    return d.getMonth() === month && d.getFullYear() === year;
  });

  const totalMonto = rows.reduce((s, r) => s + num(r.monto), 0);
  const totalIva = totalMonto * IVA_RATE;

  function openNew() {
    setForm({ fecha: `${year}-${String(month+1).padStart(2,'0')}-01`, descripcion: '', monto: '', notas: '' });
    setEditRow(null);
    setShowModal(true);
  }

  function openEdit(r) {
    setForm({ ...r });
    setEditRow(r.id);
    setShowModal(true);

    setData(prev => {

        : [...prev.ventasConsumidor, { id: newId(), ...form }];
      return { ...prev, ventasConsumidor: list };
    });
    setShowModal(false);

    setData(prev => ({ ...prev, ventasConsumidor: prev.ventasConsumidor.filter(r => r.id !== id) }));

    <div>
      <div className="section-header">

          <div className="kpi-sub">{rows.length} registros</div>

        <div className="kpi-card">
          <div className="kpi-label">IVA débito (13%)</div>
          <div className="kpi-value" style={{fontSize:'var(--text-2xl)',color:'var(--danger)'}}>{fmt(totalIva)}</div>
          <div className="kpi-sub">A reportar al MH</div>

    setData(prev => {
      const list = editRow
        ? prev.compras.map(r => r.id === editRow ? { ...r, ...form, ivaCredito: ivaAuto } : r)
        : [...prev.compras, { id: newId(), ...form, ivaCredito: ivaAuto }];
      return { ...prev, compras: list };
    });
    setShowModal(false);
  }
  function del(id) { setData(p => ({...p, compras: p.compras.filter(r => r.id !== id)})); }

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="section-title">Compras y costos</div>
          <div className="section-desc">Crédito fiscal de compras — {MONTHS[month]} {year}</div>
        </div>
        <button className="btn btn-primary" onClick={openNew}><Icon name="plus" size={15}/> Agregar compra</button>
      </div>

      <div className="kpi-grid" style={{gridTemplateColumns:'repeat(3,1fr)', marginBottom:'var(--s-5)'}}>
        <div className="kpi-card">
          <div className="kpi-label">Total compras</div>
          <div className="kpi-value" style={{fontSize:'var(--text-2xl)'}}>{fmt(totalMonto)}</div>
          <div className="kpi-sub">{rows.length} registros</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">IVA crédito fiscal</div>
          <div className="kpi-value" style={{fontSize:'var(--text-2xl)',color:'var(--success-text)'}}>{fmt(totalIva)}</div>
          <div className="kpi-sub">Acreditable contra débito</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">Subtotal (sin IVA)</div>
          <div className="kpi-value" style={{fontSize:'var(--text-2xl)'}}>{fmt(totalMonto - totalIva)}</div>
          <div className="kpi-sub">Costo neto</div>
        </div>
      </div>

      <div className="table-wrap">
        <div className="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Proveedor</th>
                <th>NRC</th>
                <th>Descripción</th>
                <th className="num">Monto total</th>
                <th className="num">IVA crédito</th>
                <th className="num">Subtotal</th>
                <th style={{width:80}}></th>
              </tr>
            </thead>
            <tbody>
              {rows.length === 0 && (
                <tr><td colSpan={8}><div className="empty-state"><div className="empty-title">Sin compras registradas</div><div className="empty-desc">Agrega tus compras y costos del mes.</div></div></td></tr>
              )}
              {rows.map(r => (
                <tr key={r.id}>
                  <td className="muted">{r.fecha}</td>
                  <td style={{fontWeight:500}}>{r.proveedor}</td>
                  <td><code style={{fontFamily:'var(--font-mono)',fontSize:'var(--text-xs)',color:'var(--fg-3)'}}>{r.nrc}</code></td>
                  <td>{r.descripcion}</td>
                  <td className="num">{fmt(r.monto)}</td>
                  <td className="num" style={{color:'var(--success-text)'}}>{fmt(r.ivaCredito)}</td>
                  <td className="num">{fmt(num(r.monto) - num(r.ivaCredito))}</td>
                  <td>
                    <div style={{display:'flex',gap:'var(--s-1)',justifyContent:'flex-end'}}>
                      <button className="btn-icon" onClick={() => openEdit(r)}><Icon name="edit" size={14}/></button>
                      <button className="btn-icon" style={{color:'var(--danger-text)'}} onClick={() => del(r.id)}><Icon name="trash" size={14}/></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        {rows.length > 0 && (
          <div className="table-footer">
            <div className="table-totals">
              <div className="total-item">Total: <strong>{fmt(totalMonto)}</strong></div>
              <div className="total-item">IVA crédito: <strong style={{color:'var(--success-text)'}}>{fmt(totalIva)}</strong></div>
              <div className="total-item">Neto: <strong>{fmt(totalMonto-totalIva)}</strong></div>
            </div>
            <div className="caption">{rows.length} registros</div>
          </div>
        )}
      </div>

      {showModal && (
        <Modal title={editRow ? 'Editar compra' : 'Nueva compra'} onClose={() => setShowModal(false)} onSave={save}>
          <div className="two-col">
            <div className="field-group">
              <label className="field-label">Fecha</label>
              <input type="date" className="field-input" value={form.fecha} onChange={e => setForm(p => ({...p, fecha: e.target.value}))} />
            </div>
            <div className="field-group">
              <label className="field-label">NRC del proveedor</label>
              <input type="text" className="field-input" placeholder="987654-3" value={form.nrc} onChange={e => setForm(p => ({...p, nrc: e.target.value}))} />
            </div>
          </div>
          <div className="field-group">
            <label className="field-label">Proveedor</label>
            <input type="text" className="field-input" placeholder="Nombre o razón social" value={form.proveedor} onChange={e => setForm(p => ({...p, proveedor: e.target.value}))} />
          </div>
          <div className="field-group">
            <label className="field-label">Descripción</label>
            <input type="text" className="field-input" placeholder="Qué se compró" value={form.descripcion} onChange={e => setForm(p => ({...p, descripcion: e.target.value}))} />
          </div>
          <div className="two-col">
            <div className="field-group">
              <label className="field-label">Monto total (con IVA)</label>
              <input type="number" className="field-input" placeholder="0.00" value={form.monto} onChange={e => setForm(p => ({...p, monto: e.target.value, ivaCredito: ''}))} step="0.01" />
            </div>
            <div className="field-group">
              <label className="field-label">IVA crédito fiscal</label>
              <input type="number" className="field-input" placeholder={form.monto ? fmt(num(form.monto)*IVA_RATE/(1+IVA_RATE)) : '0.00'} value={form.ivaCredito} onChange={e => setForm(p => ({...p, ivaCredito: e.target.value}))} step="0.01" />
            </div>
          </div>
          {form.monto && (
            <div style={{background:'var(--surface-2)',borderRadius:'var(--r-md)',padding:'var(--s-3) var(--s-4)',display:'flex',gap:'var(--s-5)'}}>
              <div className="total-item">IVA automático: <strong style={{color:'var(--success-text)'}}>{fmt(num(form.monto)*IVA_RATE/(1+IVA_RATE))}</strong></div>
              <div style={{fontSize:'var(--text-xs)',color:'var(--fg-4)'}}>Puedes ajustarlo manualmente</div>
            </div>
          )}
        </Modal>
      )}
    </div>
  );
}

/* ─────────── CONTRIBUYENTES ─────────── */
function ContribuyentesScreen({ data, setData }) {
  const [showModal, setShowModal] = useState(false);
  const [editId, setEditId] = useState(null);
  const [search, setSearch] = useState('');
  const [tab, setTab] = useState('all');
  const empty = { nombre:'', nit:'', nrc:'', giro:'', telefono:'', email:'', direccion:'', tipo:'Cliente' };
  const [form, setForm] = useState(empty);

  const filtered = data.contribuyentes.filter(c => {
    const match = !search || c.nombre.toLowerCase().includes(search.toLowerCase()) || c.nrc.includes(search) || c.nit.includes(search);
    const typeMatch = tab === 'all' || c.tipo === tab;
    return match && typeMatch;
  });

  function openNew() { setForm(empty); setEditId(null); setShowModal(true); }
  function openEdit(c) { setForm({...c}); setEditId(c.id); setShowModal(true); }
  function save() {
    if (!form.nombre || !form.nrc) return;
    setData(prev => {
      const list = editId
        ? prev.contribuyentes.map(c => c.id === editId ? { ...c, ...form } : c)
        : [...prev.contribuyentes, { id: newId(), ...form }];
      return { ...prev, contribuyentes: list };
    });
    setShowModal(false);
  }
  function del(id) { setData(p => ({...p, contribuyentes: p.contribuyentes.filter(c => c.id !== id)})); }

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="section-title">Contribuyentes</div>
          <div className="section-desc">Clientes y proveedores registrados</div>
        </div>
        <div style={{display:'flex',gap:'var(--s-3)'}}>
          <div style={{position:'relative'}}>
            <Icon name="search" size={15} style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--fg-4)'}} />
            <input type="text" className="field-input" style={{paddingLeft:32,width:220}} placeholder="Buscar por nombre o NRC…" value={search} onChange={e => setSearch(e.target.value)} />
          </div>
          <button className="btn btn-primary" onClick={openNew}><Icon name="plus" size={15}/> Agregar</button>
        </div>
      </div>

      <div className="tabs">
        {[['all','Todos'],['Cliente','Clientes'],['Proveedor','Proveedores']].map(([v,l]) => (
          <div key={v} className={`tab${tab===v?' active':''}`} onClick={() => setTab(v)}>{l}</div>
        ))}
      </div>

      {filtered.length === 0 ? (
        <div className="table-wrap"><div className="empty-state"><div className="empty-title">Sin resultados</div><div className="empty-desc">Intenta con otra búsqueda o agrega un contribuyente.</div></div></div>
      ) : (
        <div className="contrib-grid">
          {filtered.map(c => (
            <div className="contrib-card" key={c.id}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'var(--s-3)'}}>
                <div>
                  <div className="contrib-name">{c.nombre}</div>
                  <span className={`badge badge-${c.tipo==='Cliente'?'info':'neutral'}`}>
                    <span className="badge-dot"></span>{c.tipo}
                  </span>
                </div>
              </div>
              <div className="contrib-meta">
                <div className="contrib-field">NIT <span style={{fontFamily:'var(--font-mono)',fontSize:'var(--text-xs)'}}>{c.nit}</span></div>
                <div className="contrib-field">NRC <span style={{fontFamily:'var(--font-mono)',fontSize:'var(--text-xs)'}}>{c.nrc}</span></div>
                {c.giro && <div className="contrib-field">Giro <span>{c.giro}</span></div>}
                {c.telefono && <div className="contrib-field">Tel <span>{c.telefono}</span></div>}
                {c.email && <div className="contrib-field">Email <span style={{wordBreak:'break-all'}}>{c.email}</span></div>}
                {c.direccion && <div className="contrib-field">Dir. <span>{c.direccion}</span></div>}
              </div>
              <div className="contrib-actions">
                <button className="btn btn-secondary btn-sm" onClick={() => openEdit(c)}><Icon name="edit" size={13}/> Editar</button>
                <button className="btn btn-danger btn-sm" onClick={() => del(c.id)}><Icon name="trash" size={13}/> Eliminar</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {showModal && (
        <Modal title={editId ? 'Editar contribuyente' : 'Nuevo contribuyente'} onClose={() => setShowModal(false)} onSave={save}>
          <div className="two-col">
            <div className="field-group" style={{gridColumn:'1/-1'}}>
              <label className="field-label">Nombre / Razón social</label>
              <input type="text" className="field-input" placeholder="Empresa o persona natural" value={form.nombre} onChange={e => setForm(p => ({...p, nombre: e.target.value}))} />
            </div>
            <div className="field-group">
              <label className="field-label">NIT</label>
              <input type="text" className="field-input" placeholder="0614-000000-000-0" value={form.nit} onChange={e => setForm(p => ({...p, nit: e.target.value}))} />
            </div>
            <div className="field-group">
              <label className="field-label">NRC</label>
              <input type="text" className="field-input" placeholder="123456-7" value={form.nrc} onChange={e => setForm(p => ({...p, nrc: e.target.value}))} />
            </div>
            <div className="field-group">
              <label className="field-label">Tipo</label>
              <select className="field-input" value={form.tipo} onChange={e => setForm(p => ({...p, tipo: e.target.value}))}>
                <option>Cliente</option>
                <option>Proveedor</option>
              </select>
            </div>
            <div className="field-group">
              <label className="field-label">Giro</label>
              <input type="text" className="field-input" placeholder="Actividad económica" value={form.giro} onChange={e => setForm(p => ({...p, giro: e.target.value}))} />
            </div>
            <div className="field-group">
              <label className="field-label">Teléfono</label>
              <input type="text" className="field-input" placeholder="2234-5678" value={form.telefono} onChange={e => setForm(p => ({...p, telefono: e.target.value}))} />
            </div>
            <div className="field-group">
              <label className="field-label">Email</label>
              <input type="email" className="field-input" placeholder="correo@empresa.com" value={form.email} onChange={e => setForm(p => ({...p, email: e.target.value}))} />
            </div>
            <div className="field-group" style={{gridColumn:'1/-1'}}>
              <label className="field-label">Dirección</label>
              <input type="text" className="field-input" placeholder="Dirección fiscal" value={form.direccion} onChange={e => setForm(p => ({...p, direccion: e.target.value}))} />
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ─────────── APP ─────────── */
function App() {
  const [screen, setScreen] = useState('hub');
  const [month, setMonth] = useState(CURRENT_MONTH);
  const [year, setYear] = useState(CURRENT_YEAR);
  const [data, setData] = useState(seedData);

  // Persist
  React.useEffect(() => {
    localStorage.setItem('abx-erp-data', JSON.stringify(data));
  }, [data]);

  const nav = [
    { id: 'hub', icon: 'home', label: 'Resumen fiscal' },
    { id: 'consumidor', icon: 'receipt', label: 'Ventas consumidor' },
    { id: 'contribuyente', icon: 'file-text', label: 'Ventas contribuyente' },
    { id: 'compras', icon: 'credit-card', label: 'Compras' },
    { id: 'contribuyentes', icon: 'users', label: 'Contribuyentes' },
  ];

  const titles = {
    hub: 'Resumen fiscal',
    consumidor: 'Ventas al consumidor',
    contribuyente: 'Ventas al contribuyente',
    compras: 'Compras y costos',
    contribuyentes: 'Contribuyentes',
  };

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"theme": "light"}/*EDITMODE-END*/;
  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', TWEAK_DEFAULTS.theme);
  }, []);

  return (
    <div className="app-shell">
      {/* Sidebar */}
      <aside className="sidebar">
        <div className="sidebar-logo">
          <img src="assets/logo.svg" alt="ABX Pyme" />
        </div>
        <div className="sidebar-section">
          <div className="sidebar-section-label">Declaración mensual</div>
          {nav.map(n => (
            <div key={n.id} className={`nav-item${screen===n.id?' active':''}`} onClick={() => setScreen(n.id)}>
              <Icon name={n.icon} size={18} className="nav-icon" />
              {n.label}
            </div>
          ))}
        </div>
      </aside>

      {/* Main */}
      <div className="main-area">
        <header className="topbar">
          <div className="topbar-title">{titles[screen]}</div>
          <div className="month-selector">
            <Icon name="calendar" size={16} style={{color:'var(--fg-3)'}} />
            <select className="month-select" value={month} onChange={e => setMonth(+e.target.value)}>
              {MONTHS.map((m,i) => <option key={i} value={i}>{m}</option>)}
            </select>
            <select className="month-select" value={year} onChange={e => setYear(+e.target.value)}>
              {[2024,2025,2026,2027].map(y => <option key={y}>{y}</option>)}
            </select>
          </div>
          <div style={{display:'flex',gap:'var(--s-3)',alignItems:'center'}}>
            <div style={{width:32,height:32,borderRadius:'50%',background:'var(--brand-primary-100)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--brand-primary-700)',fontSize:'var(--text-sm)',fontWeight:600}}>U</div>
          </div>
        </header>

        <main className="content">
          {screen === 'hub' && <HubScreen data={data} month={month} year={year} />}
          {screen === 'consumidor' && <VentasConsumidorScreen data={data} setData={setData} month={month} year={year} />}
          {screen === 'contribuyente' && <VentasContribuyenteScreen data={data} setData={setData} month={month} year={year} />}
          {screen === 'compras' && <ComprasScreen data={data} setData={setData} month={month} year={year} />}
          {screen === 'contribuyentes' && <ContribuyentesScreen data={data} setData={setData} />}
        </main>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
